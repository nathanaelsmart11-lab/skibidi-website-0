<!doctype html>
<html>
  <head>
    <title>skibidi page</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="scripts.js"></script>
    <script src="games.js"></script>
  </head>
  <body>
    <header>
      <div id="logo">OUR LOGO HERE</div>
      <nav>
        <ul>
          <li>
            <a href="index.html"><button class="button">Homepage</button></a>
          </li>
          <li>
            <a href="index2.html"><button class="button">Page 2</button></a>
          </li>
          <li>
            <button class="button" id="theme-toggle">toggle-theme</button>
          </li>
        </ul>
      </nav>
    </header>
    <div class="wrapping-div">
      <h1>Hi, I'm Nathanael</h1>
      <p>I like these games</p>
      <img src="kerbal.png" alt="poor bob alone on the mun" id="RandomDog" />

      <form class="form" action="javascript:void(0);">
        <label for="search">Search games :</label>
        <input
          type="text"
          id="search"
          name="search"
          placeholder="game name here"
        />
        <label for="genre">Chose a game genre :</label>
        <select name="genre" id="genre-dropdown">
          <option value="all">show all games :D</option>
        </select>

        <button id="game-loader" class="button">Games :O</button>
        <div id="list"></div>
      </form>

      <br />

      <button id="count-btn" class="button">Plus 1 :D</button>
      <p>Clicks: <span id="count-display">0</span></p>
    </div>
  </body>
</html>
